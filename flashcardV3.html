<title>flash card ศัพท์จีน</title>
<style>
:root{--bg:#f9e4e1;--bg2:#f3d2cd;--card:#fff9f5;--ink:#4a1f1d;--mute:#9a6762;--red:#c8453d;--red2:#a82e2a;--gold:#c9973f;--line:#e5b5b0;--ok:#3f7d58}
@media (prefers-color-scheme:dark){:root{--bg:#2a1213;--bg2:#341819;--card:#3b1c1d;--ink:#f6e4df;--mute:#c49a94;--red:#ef7a70;--red2:#f08d84;--gold:#e0b25a;--line:#6b3a3a;--ok:#7ccf9a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px 16px;background-color:var(--bg);background-image:linear-gradient(var(--bg2) 1px,transparent 1px),linear-gradient(90deg,var(--bg2) 1px,transparent 1px);background-size:28px 28px}
.title{display:flex;align-items:center;gap:12px;margin:4px 0 18px;font-size:1.5rem;font-weight:600;color:var(--red2);letter-spacing:.04em}
.seal{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;background:var(--red);color:#fff9f5;font-family:"Noto Serif SC","Songti SC",serif;font-size:1.5rem;border-radius:6px;transform:rotate(-4deg);box-shadow:0 2px 0 var(--red2)}
.top{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:.95rem;margin-bottom:14px}
.top label{display:flex;gap:6px;align-items:center;cursor:pointer;accent-color:var(--red)}
.card{width:100%;max-width:520px;height:340px;perspective:1000px;cursor:pointer;border:0;background:none;padding:0;color:inherit;font:inherit}
.card:focus-visible{outline:3px solid var(--gold);outline-offset:4px;border-radius:14px}
.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:2px solid var(--red);border-radius:12px;box-shadow:inset 0 0 0 6px var(--card),inset 0 0 0 7px var(--gold),0 6px 18px rgba(168,46,42,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
.back{transform:rotateY(180deg)}
.hanzi{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-weight:700;color:var(--red2);font-size:clamp(3.5rem,18vw,6.5rem);line-height:1.15;word-break:break-all}
.pinyin{font-size:1.9rem;color:var(--red);margin-bottom:10px}
.mean{font-size:1.6rem}
.hint{position:absolute;bottom:18px;font-size:.85rem;color:var(--mute)}
.mark{position:absolute;top:18px;right:20px;width:14px;height:14px;border-radius:3px;background:var(--red);transform:rotate(-4deg)}
.mark.ok{background:var(--ok)}
.row{display:flex;gap:10px;margin-top:18px;width:100%;max-width:520px}
button.b{flex:1;padding:13px 8px;font:inherit;font-size:1rem;border-radius:10px;border:1.5px solid var(--red);background:var(--card);color:var(--red2);cursor:pointer;transition:background .15s,color .15s}
button.b:hover{background:var(--red);color:#fff9f5}
button.b:focus-visible{outline:3px solid var(--gold)}
button.b.no{color:var(--red2)}
button.b.yes{color:var(--ok);border-color:var(--ok)}
button.b.yes:hover{background:var(--ok);color:#fff9f5}
#msg{margin-top:40px;color:var(--mute);text-align:center}
@media (prefers-reduced-motion:reduce){.inner,button.b{transition:none}}
.pandaS{width:46px;height:51px}
.foot{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin-top:26px}
.pandaL{width:130px;height:145px;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
.bam{width:44px;height:94px}.bam.b2{height:70px;transform:scaleX(-1)}
@keyframes sway{50%{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.pandaL{animation:none}}
</style>

<script>

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRy6A3HT6Fl9LXYeSfcqP1tOO3fTPGNeXfauneDSKWaAkMcUbR4zwn7MDQ0n2bpy1IQ8_S8qz_HQ53y/pub?gid=0&single=true&output=csv";

const BACKUP = `ลำดับที่,คำศัพท์,คำอ่าน,คำแปล

74,水果,shuǐguǒ (สุย กั่ว),ผลไม้

93,逛街,guàngjiē (กว้าง เจียะ),เดินเที่ยว เดินช้อปปิ้ง

const $ = id => document.getElementById(id);
let all = [], list = [], i = 0;
let known = {};
try { known = JSON.parse(localStorage.getItem("known") || "{}"); } catch(e) {}
const save = () => { try { localStorage.setItem("known", JSON.stringify(known)); } catch(e) {} };

function parseCSV(t){
  const rows=[]; let r=[], c="", q=false;
  for(let k=0;k<t.length;k++){
    const ch=t[k];
    if(q){ if(ch=='"'){ if(t[k+1]=='"'){c+='"';k++;} else q=false; } else c+=ch; }
    else if(ch=='"') q=true;
    else if(ch==","){ r.push(c); c=""; }
    else if(ch=="\n"||ch=="\r"){ if(ch=="\r"&&t[k+1]=="\n")k++; r.push(c); rows.push(r); r=[]; c=""; }
    else c+=ch;
  }
  if(c!==""||r.length){ r.push(c); rows.push(r); }
  return rows;
}

function build(){
  const only = $("onlyNew").checked;
  list = only ? all.filter(w => !known[w.hz]) : all.slice();
  i = Math.min(i, Math.max(list.length-1, 0));
  show();
}

function show(){
  $("card").classList.remove("flip");
  if(!list.length){
    $("card").hidden = $("r1").hidden = $("r2").hidden = true;
    $("msg").textContent = "ไม่มีคำให้ทบทวนแล้ว ปิดตัวเลือก \"เฉพาะคำที่ยังไม่จำ\" เพื่อดูทั้งหมด";
    $("count").textContent = "0 คำ"; return;
  }
  $("msg").textContent = "";
  $("card").hidden = $("r1").hidden = $("r2").hidden = false;
  const w = list[i];
  $("hz").textContent = w.hz; const m = w.py.match(/^(.*?)\s*\((.*)\)\s*$/);
  $("py").textContent = m ? m[1] : w.py; $("th").textContent = m ? m[2] : ""; $("mn").textContent = w.mn;
  $("mark").className = "mark" + (known[w.hz] ? " ok" : "");
  $("count").textContent = `${i+1} / ${list.length}  (จำได้ ${Object.keys(known).filter(k=>all.some(w=>w.hz===k)).length}/${all.length})`;
}

const go = d => { if(!list.length) return; i = (i + d + list.length) % list.length; show(); };
$("card").onclick = () => $("card").classList.toggle("flip");
$("next").onclick = () => go(1);
$("prev").onclick = () => go(-1);
$("shuf").onclick = () => { i = Math.floor(Math.random()*list.length); show(); };
$("onlyNew").onchange = build;
$("ok").onclick = () => { known[list[i].hz] = 1; save(); $("onlyNew").checked ? build() : go(1); };
$("no").onclick = () => { delete known[list[i].hz]; save(); go(1); };
$("speak").onclick = () => {
  if(!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(list[i].hz); u.lang = "zh-CN"; u.rate = .8;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
};
document.addEventListener("keydown", e => {
  if(e.key=="ArrowRight") go(1);
  else if(e.key=="ArrowLeft") go(-1);
  else if(e.key==" "){ e.preventDefault(); $("card").classList.toggle("flip"); }
});

function init(t){
  const rows = parseCSV(t).filter(r => r.some(x => x.trim()));
  const h = rows.shift().map(x => x.trim());
  const ix = (name, fb) => { const n = h.indexOf(name); return n >= 0 ? n : fb; };
  const a = ix("คำศัพท์",1), b = ix("คำอ่าน",2), c = ix("คำแปล",3);
  all = rows.map(r => ({hz:(r[a]||"").trim(), py:(r[b]||"").trim(), mn:(r[c]||"").trim()})).filter(w => w.hz);
  build();
}
fetch(CSV_URL).then(r => { if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); }).then(init).catch(err => {
  try { init(BACKUP); $("note").textContent = "แสดงข้อมูลสำรองที่ฝังในไฟล์ (เชื่อม Google Sheets ไม่ได้)"; return; } catch(e) {}
  $("count").textContent = "";
  const why = !CSV_URL.startsWith("http") ? "ยังไม่ได้ใส่ลิงก์ CSV ในไฟล์ (CSV_URL)"
    : location.protocol === "file:" ? "เปิดไฟล์จากเครื่องโดยตรง ลองอัปโหลดขึ้นเว็บ (เช่น Netlify Drop) แล้วเปิดผ่านลิงก์"
    : "เบราว์เซอร์เชื่อมต่อ Google Sheets ไม่ได้";
  $("msg").textContent = "โหลดคำศัพท์ไม่ได้: " + why + " [" + (err && err.message ? err.message : "error") + "]";
});
</script>
</body>
</html>
